<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TaskFlow</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <header class="app-header">
    <h1>TaskFlow</h1>
  </header>

  <main class="container">

    <section class="add-task-section">
      <h2>Naya Task Add Karo</h2>
      <form id="task-form">
        <div class="form-group">
          <label for="title">Title</label>
          <input type="text" id="title" name="title" placeholder="Task ka naam likho" />
          <span class="error-message" id="title-error"></span>
        </div>

        <div class="form-group">
          <label for="priority">Priority</label>
          <select id="priority" name="priority">
            <option value="low">Low</option>
            <option value="medium" selected>Medium</option>
            <option value="high">High</option>
          </select>
        </div>

        <div class="form-group">
          <label for="due_date">Due Date</label>
          <input type="text" id="due_date" name="due_date" placeholder="e.g. 2026-08-15" />
        </div>

        <div class="form-group">
          <label for="project_id">Project ID</label>
          <input type="number" id="project_id" name="project_id" placeholder="1" />
        </div>

        <button type="submit">Add Task</button>
      </form>
    </section>

    <section class="task-list-section">
      <h2>Tasks</h2>
      <div id="task-list" class="task-list"></div>
    </section>

  </main>

  <script src="script.js"></script>
</body>
</html>
